<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Raiany Morais Ribeiro</title>
    <link rel="stylesheet" href="../css/style.css">
    <!-- Fontes Inter e JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Ícones Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="contact-page-body">

    <!-- CABEÇALHO -->
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="brand-box">
                <img src="../imgs/img/Logo.png" alt="Logo Raiany Morais" class="logo-img">
                <div class="brand-text">
                    <span class="brand-name">Raiany Morais Ribeiro</span>
                    <span class="brand-sub">ENGENHARIA DE SOFTWARE</span>
                </div>
            </a>

            <nav class="nav-menu">
                <a href="projetos.html" class="nav-link">Projetos</a>
                <a href="experiencias.html" class="nav-link">Experiências</a>
                <a href="sobre.html" class="nav-link">Sobre mim</a>
                <a href="contato.html" class="nav-btn-contact active-btn">Contato <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
            </nav>
        </div>
    </header>

    <!-- BLOCO PRINCIPAL VERDE-LIMA -->
    <section class="contact-hero-banner">
        <div class="banner-container">
            
            <!-- Barra Superior do Banner -->
            <div class="banner-top-bar">
                <span class="mono-tag text-black">09 / PRÓXIMA CONEXÃO</span>
                <span class="mono-tag text-black font-medium">UMA BOA IDEIA COMEÇA COM UM OLÁ.</span>
            </div>

            <!-- Título e Flecha -->
            <div class="banner-content">
                <div class="banner-text-left">
                    <h1 class="banner-title">Vamos criar<br>o próximo agora?</h1>
                    <a href="mailto:raiany.morais@sga.pucminas.br" class="email-link">
                        raiany.morais@sga.pucminas.br
                    </a>
                </div>
                <div class="banner-arrow-right">
                    <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <line x1="7" y1="17" x2="17" y2="7"></line>
                        <polyline points="7 7 17 7 17 17"></polyline>
                    </svg>
                </div>
            </div>

            <!-- FORMULÁRIO DE CONTATO INTEGADO -->
            <form id="contact-form" class="banner-form">
                <div class="form-row">
                    <input type="text" name="name" placeholder="Seu Nome" required class="form-input-lime">
                    <input type="email" name="email" placeholder="Seu E-mail" required class="form-input-lime">
                </div>
                <div class="form-row">
                    <textarea name="message" rows="3" placeholder="Sua Mensagem..." required class="form-input-lime"></textarea>
                </div>
                <button type="submit" class="btn-submit-black">
                    Enviar Mensagem <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

        </div>
    </section>

    <!-- RODAPÉ INFERIOR PRETO -->
    <footer class="contact-footer">
        <div class="footer-container">
            <div class="footer-top-row">
                <h2 class="footer-brand-name">Raiany MR</h2>
                <div class="footer-social-links">
                    <a href="www.linkedin.com/in/raiany-morais-791b542b5" target="_blank" class="footer-link">LinkedIn ↗</a>
                    <a href="https://github.com/RaianyMR" target="_blank" class="footer-link">GitHub ↗</a>
                    <a href="mailto:raiany.morais@sga.pucminas.br" class="footer-link">Gmail ↗</a>
                </div>
            </div>

            <div class="footer-divider"></div>

            <div class="footer-bottom-row">
                <span class="mono-caption text-muted">© 2026 RaianyMR / PORTFÓLIO</span>
                
            </div>
        </div>
    </footer>

    <script src="../js/main.js"></script>
</body>
</html>
