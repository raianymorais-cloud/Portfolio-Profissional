<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Raiany Morais Ribeiro</title>
    <link rel="stylesheet" href="../css/style.css">
    <!-- Fontes Inter e JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Ícones Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="contact-page-body">

    <!-- CABEÇALHO -->
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="brand-box">
                <img src="../imgs/img/Logo.png" alt="Logo Raiany Morais" class="logo-img">
                <div class="brand-text">
                    <span class="brand-name">Raiany Morais Ribeiro</span>
                    <span class="brand-sub">ENGENHARIA DE SOFTWARE</span>
                </div>
            </a>

            <nav class="nav-menu">
                <a href="projetos.html" class="nav-link">Projetos</a>
                <a href="experiencias.html" class="nav-link">Experiências</a>
                <a href="sobre.html" class="nav-link">Sobre mim</a>
                <a href="contato.html" class="nav-btn-contact active-btn">Contato <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
            </nav>
        </div>
    </header>

    <!-- BLOCO PRINCIPAL VERDE-LIMA -->
    <section class="contact-hero-banner">
        <div class="banner-container">
            
            <div class="banner-top-bar">
                <span class="mono-tag text-black">09 / PRÓXIMA CONEXÃO</span>
                <span class="mono-tag text-black font-medium">UMA BOA IDEIA COMEÇA COM UM OLÁ.</span>
            </div>

            <div class="banner-content">
                <div class="banner-text-left">
                    <h1 class="banner-title">Vamos criar<br>o próximo agora?</h1>
                    <a href="mailto:raiany.morais@sga.pucminas.br" class="email-link">
                        raiany.morais@sga.pucminas.br
                    </a>
                </div>
                <div class="banner-arrow-right">
                    <i class="fa-solid fa-arrow-up-right-dots" style="font-size: 3rem;"></i>
                </div>
            </div>

            <!-- FORMULÁRIO COM VALIDAÇÃO E ENVIO DE E-MAIL -->
            <form id="contact-form" class="banner-form" novalidate>
                <div class="form-row">
                    <input type="text" name="name" id="form-name" placeholder="Seu Nome *" required class="form-input-lime">
                    <input type="email" name="email" id="form-email" placeholder="Seu E-mail *" required class="form-input-lime">
                </div>
                <div class="form-row">
                    <textarea name="message" id="form-message" rows="4" placeholder="Sua Mensagem... *" required class="form-input-lime"></textarea>
                </div>
                <button type="submit" class="btn-submit-black">
                    Enviar Mensagem <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>

        </div>
    </section>

    <!-- RODAPÉ ESCURO COM ÍCONES E LINKS -->
    <footer class="contact-footer">
        <div class="footer-container">
            <div class="footer-top-row">
                <h2 class="footer-brand-name">Raiany MR</h2>
                <div class="footer-social-links">
                    <a href="https://www.linkedin.com/in/raiany-morais-791b542b5" target="_blank" class="footer-link">
                        <i class="fa-brands fa-linkedin"></i> LinkedIn ↗
                    </a>
                    <a href="https://github.com/raianymorais-cloud/Portfolio-Profissional.git" target="_blank" class="footer-link">
                        <i class="fa-brands fa-github"></i> GitHub ↗
                    </a>
                    <a href="mailto:raiany.morais@sga.pucminas.br" class="footer-link">
                        <i class="fa-solid fa-envelope"></i> Gmail ↗
                    </a>
                </div>
            </div>

            <div class="footer-divider"></div>

            <div class="footer-bottom-row">
                <span class="mono-caption text-muted">© 2026 RaianyMR / PORTFÓLIO</span>
                <button id="scroll-to-top-btn" class="top-scroll-btn">
                    VOLTAR AO TOPO ↑
                </button>
            </div>
        </div>
    </footer>

    <script src="../js/main.js"></script>
</body>
</html>
